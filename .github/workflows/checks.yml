name: Game and preserved proof checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test browser game rules
        run: node --test tests/engine.test.cjs tests/bot.test.cjs
      - name: Check preserved source bytes and historical receipts
        run: python3 tools/verify_proof.py
